<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Imagenología Veterinaria</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&amp;family=Open+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilo_home.css">
    <link rel="stylesheet" href="./css/acceso.css">
    <script type="module" src="./js/acceso.js"></script>
    <script type="module" src="./js/ui/imagenes-publicas.js"></script>
</head>
<body class="pagina-acceso">
    <header class="navbar">
        <div class="container navbar-container">
            <a href="./index.html" class="brand-logo">
                <div class="logo-icon">
                    <img src="./img/logo-imagenologia-veterinaria.png" data-imagen="sitio.logo" alt="">
                </div>
                <div class="logo-text">
                    <span class="logo-title">IMAGENOLOGÍA</span>
                    <span class="logo-subtitle">VETERINARIA</span>
                </div>
            </a>
        </div>
    </header>
    <main class="acceso-contenido">
            <section id="panel-acceso" class="acceso-tarjeta" aria-labelledby="titulo-acceso">
                <h1 id="titulo-acceso">Iniciar sesión</h1>
                <p class="acceso-ayuda" id="ayuda-acceso">Ingresa con tu correo y contraseña.</p>

                <div class="acceso-modos" role="group" aria-label="Modo de acceso">
                    <button id="modo-login" type="button" class="btn btn-outline"
                            aria-pressed="true">Iniciar sesión</button>
                    <button id="modo-registro" type="button" class="btn btn-outline"
                            aria-pressed="false">Registrarse</button>
                </div>

                <form id="formulario-acceso" class="acceso-formulario" method="post">
                    <div class="campo">
                        <label for="correo">Correo electrónico</label>
                        <input id="correo" name="correo" type="email" autocomplete="username" required>
                    </div>
                    <div class="campo">
                        <label for="contrasena">Contraseña</label>
                        <div class="campo-contrasena">
                            <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
                            <button id="ver-contrasena" class="ver-contrasena" type="button" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="contrasena">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button id="boton-acceso" type="submit" class="btn btn-primary" disabled>Iniciar sesión</button>
                    <p id="estado-acceso" class="acceso-estado" role="status" aria-atomic="true"></p>
                    <a href="./contacto.html" class="btn btn-outline">Continuar como visitante</a>
                </form>
            </section>
    </main>
</body>
</html>
